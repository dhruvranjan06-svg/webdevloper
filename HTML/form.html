<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
     <h1>Student Data Form</h1>

    <form>
    <label for="name">Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter Name">
<br>
<label for="father">Father Name:</label>
        <input type="text" id="father" name="father" placeholder="Enter Father Name">

        <br>
        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <br>
 <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter Email">

        <br>

        <label for="course">Course:</label>

        <select id="course" name="course">
            <option value="B.Tech">B.Tech</option>
            <option value="BCA">BCA</option>
            <option value="MCA">MCA</option>
            <option value="BBA">BBA</option>
        </select>
        <label for="track">Track:</label>

        <select id="track" name="track">
            <option value="Web Development">Web Development</option>
            <option value="Java">Java</option>
            <option value="Cloud Computing">Cloud Computing</option>
            <option value="Data Science">Data Science</option>
        </select>

        <br><br>


        <!-- Section -->
        <label for="section">Section:</label>
        <input type="text" id="section" name="section" placeholder="Enter Section">

        <br><br>


        <!-- Semester -->
        <label for="semester">Semester:</label>

        <select id="semester" name="semester">
            <option value="1st">1st</option>
            <option value="2nd">2nd</option>
            <option value="3rd">3rd</option>
            <option value="4th">4th</option>
            <option value="5th">5th</option>
            <option value="6th">6th</option>
            <option value="7th">7th</option>
            <option value="8th">8th</option>
        </select>

        <br><br>


        <!-- Year -->
        <label for="year">Year:</label>

        <select id="year" name="year">
            <option value="1st Year">1st Year</option>
            <option value="2nd Year">2nd Year</option>
            <option value="3rd Year">3rd Year</option>
            <option value="4th Year">4th Year</option>
        </select>

        <br>


        
        <label for="cpi">CPI:</label>
        <input type="number" id="cpi" name="cpi" step="0.01" placeholder="Enter CPI">

        <br>


        
        <input type="submit" value="Submit">

        <br>
    </form>
</body>
</html>
