<!DOCTYPE html>
<html>

<head>
    <title>Iframe and Video Tag</title>
</head>

<body>

    <!-- ================= IFRAME TAG ================= -->
    <!-- iframe ka use ek website/video ko apne webpage ke andar
         display karne ke liye hota hai -->

    <h1>Iframe Tag</h1>

    <p>Website inside website</p>

    <iframe
        src="https://www.youtube.com/embed/dQw4w9WgXcQ"
        width="560"
        height="315">
    </iframe>


    <hr>


    <!-- ================= VIDEO TAG ================= -->
    <!-- video tag ka use webpage par video play karne ke liye hota hai -->

    <h1>Video Tag</h1>

    <video
        src="myVid.mp4"
        height="300"
        width="500"
        controls>
    </video>


    <!-- Video ke important attributes:
         controls  → play/pause/volume buttons
         height    → video ki height
         width     → video ki width
         loop      → video baar-baar chalega
         autoplay  → video automatically start hoga
         muted     → video ki sound off rahegi
    -->

</body>

</html>
